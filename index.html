<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Farm Daily Reports</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    header {
        background: #003366;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    .farm-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .farm-card {
        background: white;
        width: 280px;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.2s;
    }

    .farm-card:hover {
        transform: translateY(-5px);
    }

    .report {
        display: none;
        margin-top: 30px;
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .metric {
        display: inline-block;
        background: #f0f4f8;
        margin: 10px;
        padding: 15px;
        border-radius: 10px;
        min-width: 180px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    table, th, td {
        border: 1px solid #ddd;
    }

    th {
        background: #003366;
        color: white;
    }

    th, td {
        padding: 10px;
        text-align: left;
    }

    ul {
        margin-top: 15px;
    }

    button {
        background: #0078d4;
        border: none;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
    }
</style>
</head>
<body>

<header>
    <h1>Wind Farm Operations Portal</h1>
    <p>Select a wind farm to view today's report</p>
</header>

<div class="container">

    <div class="farm-grid">

        <div class="farm-card" onclick="generateReport('North Sea Alpha')">
            <h2>North Sea Alpha</h2>
            <p>18 Turbines</p>
        </div>

        <div class="farm-card" onclick="generateReport('Ostend Horizon')">
            <h2>Ostend Horizon</h2>
            <p>24 Turbines</p>
        </div>

        <div class="farm-card" onclick="generateReport('Flanders Offshore')">
            <h2>Flanders Offshore</h2>
            <p>32 Turbines</p>
        </div>

    </div>

    <div id="report" class="report">
        <h2 id="farmName"></h2>
        <p id="reportDate"></p>

        <div id="metrics"></div>

        <h3>Turbine Performance</h3>
        <table>
            <thead>
                <tr>
                    <th>Turbine</th>
                    <th>Availability</th>
                    <th>Production (MWh)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="turbineTable"></tbody>
        </table>

        <h3>Key Events</h3>
        <ul id="events"></ul>

        <button onclick="location.reload()">Back to Wind Farms</button>
    </div>

</div>

<script>

function random(min, max) {
    return (Math.random() * (max - min) + min).toFixed(1);
}

function generateReport(farmName) {

    document.getElementById("report").style.display = "block";

    document.getElementById("farmName").innerText =
        farmName + " - Daily Performance Report";

    document.getElementById("reportDate").innerText =
        new Date().toLocaleDateString();

    const availability = random(92, 100);
    const production = random(250, 500);
    const budget = random(90, 110);
    const loss = random(0, 20);

    document.getElementById("metrics").innerHTML = `
        <div class="metric">
            <strong>Availability</strong><br>${availability} %
        </div>

        <div class="metric">
            <strong>Production</strong><br>${production} MWh
        </div>

        <div class="metric">
            <strong>Budget Achievement</strong><br>${budget} %
        </div>

        <div class="metric">
            <strong>Lost Production</strong><br>${loss} MWh
        </div>
    `;

    const table = document.getElementById("turbineTable");
    table.innerHTML = "";

    for(let i = 1; i <= 5; i++) {

        const avail = random(85,100);
        const prod = random(8,25);

        const statuses = ["✅ Running", "⚠️ Warning", "🔧 Maintenance"];
        const status =
            statuses[Math.floor(Math.random()*statuses.length)];

        table.innerHTML += `
            <tr>
                <td>WTG-${i.toString().padStart(2,'0')}</td>
                <td>${avail}%</td>
                <td>${prod}</td>
                <td>${status}</td>
            </tr>
        `;
    }

    const eventList = [
        "Pitch fault detected on WTG-03",
        "Grid curtailment event for 45 minutes",
        "Converter reset successfully completed",
        "Unexpected wind gusts triggered shutdown",
        "Remote restart performed by control room",
        "Communication loss resolved",
        "Scheduled maintenance completed"
    ];

    const events = document.getElementById("events");
    events.innerHTML = "";

    for(let i = 0; i < 3; i++) {
        const event =
            eventList[Math.floor(Math.random()*eventList.length)];

        events.innerHTML += `<li>${event}</li>`;
    }

    document.querySelector(".farm-grid").style.display = "none";
}

</script>

</body>
</html>
